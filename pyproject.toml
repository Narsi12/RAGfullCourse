[project]
name = "udemyrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Narsi12", email = "87262117+Narsi12@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.4.3",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pymupdf>=1.28.2",
    "pypdf>=6.15.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.7.0",
    "tiktoken>=0.13.0",
    "unstructured[docx]>=0.27.10",
]

[project.scripts]
udemyrag = "udemyrag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
